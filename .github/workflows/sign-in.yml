name: 签到

on:
  workflow_dispatch: # workflow_dispatch 要放最后，否则会导致 schedule 失效

permissions:
  contents: write

jobs:
  sign-in:
    runs-on: ubuntu-latest
    env:
      WECHAT_PARAMS: ${{ secrets.WECHAT_PARAMS }}
      MOLE_ACCOUNTS: ${{ secrets.MOLE_ACCOUNTS }}
      ECLOUD_ACCOUNT: ${{ secrets.ECLOUD_ACCOUNT }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5
      - name: 安装环境
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: 安装依赖
        run: |
          pip install uv
          uv sync
      - name: 天翼云盘签到
        run: |
          uv run ecloud.py